name: Browser acceptance tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Start local production site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/reach-http.log 2>&1 &
          echo $! > /tmp/reach-http.pid
          sleep 2
      - name: Run browser acceptance tests
        run: npx playwright test -c playwright.config.js
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
