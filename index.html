/* Final Premium release alignment — based on approved 440px Figma mobile frames */
html{scroll-behavior:smooth}
body{display:flex;justify-content:center;color:var(--forest);background:#eef4ef}
.app-shell{width:min(100%,440px);max-width:440px;margin:0 auto;min-height:100dvh;padding:0 22px 122px;background:linear-gradient(180deg,#eaf7ee 0,#f0f3f6 31%,#fafbf8 58%);box-shadow:0 0 0 1px rgba(35,79,44,.04),0 28px 80px rgba(35,79,44,.14)}
.app-header{height:60px;top:0;margin:0 -22px;padding:0 22px;background:rgba(250,251,248,.88)}
.brand{font-size:18px;font-weight:800;letter-spacing:-.4px}.brand img{width:28px;height:28px}.sync-pill{display:none}.avatar{width:36px;height:36px;font-size:12px}
.screen{padding:16px 0 18px;outline:0}.page-head{display:block;margin-bottom:18px}.page-head>.btn{margin-top:14px;width:100%}.eyebrow{font-size:10px;letter-spacing:1.1px;color:var(--muted)}
h1{font-size:32px;line-height:1.15;letter-spacing:-1.2px;margin:5px 0 5px}h2{font-size:20px;line-height:1.2}.sub{font-size:14px;line-height:1.45}
.card,.assignment{border-radius:24px;padding:18px;box-shadow:0 8px 28px rgba(35,79,44,.04)}
.hero{grid-template-columns:1fr;padding:22px;border-radius:24px;gap:14px;background:linear-gradient(135deg,#d8f1dd,#ecedf9)}.hero-art{position:absolute;right:40px;margin-top:-86px;pointer-events:none}.hero-art img{width:92px;max-height:92px}.hero h2{max-width:210px;font-size:27px}.next-action{margin-top:18px;padding:14px;border-radius:18px}
.grid.g2,.grid.g3{grid-template-columns:1fr}.metric strong{font-size:27px}.quick-grid{gap:8px}.quick{min-height:92px;padding:12px;border-radius:20px}.quick b{font-size:12px}.setup-link{width:100%;margin-top:12px}
.focus-card{border-radius:24px;padding:18px}.timer-ring{width:150px;height:150px}.timer-ring span{font-size:31px}
.assignment h3{font-size:20px}.assignment-head{gap:8px}.status{flex-shrink:0}.toolbar .btn{flex:1}.wizard{max-width:none}.steps{margin:13px 0 18px}.file-box{border:1px dashed #bbd8c2;background:#f3fbf5;border-radius:18px;padding:18px}.file-box input{max-width:100%}.notice,.callout{line-height:1.5}.flow-next{width:100%;margin-top:16px}
.week{grid-template-columns:repeat(7,72px);gap:8px;margin-left:-2px;margin-right:-2px;scrollbar-width:none}.week::-webkit-scrollbar{display:none}.day{min-height:218px;border-radius:16px;padding:10px;font-size:12px}.event{padding:8px;font-size:11px}
.kpi-grid{grid-template-columns:repeat(2,1fr)}.kpi{padding:14px}.bar-chart{height:140px}.reward{border-radius:24px}
.row{align-items:flex-start}.row>.btn{min-height:36px;padding:8px 10px}.row-main small{display:block;margin-top:3px}
.input,.select,.textarea{font-size:16px}.textarea{min-height:112px}.settings-list{display:grid;gap:4px}
.bottom-nav{bottom:14px;width:min(412px,calc(100% - 28px));height:74px;border-radius:24px;padding:6px;box-shadow:0 14px 36px rgba(35,79,44,.16)}.bottom-nav button{min-width:0}.bottom-nav button span{font-size:18px}.bottom-nav button small{font-size:9px}.bottom-nav button.active{background:#eaf7ee}
.toast{left:50%;right:auto;transform:translate(-50%,-8px);top:76px;width:calc(100% - 44px);text-align:center}.toast.show{transform:translate(-50%,0)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const KEY='reach-planner-v2';
const LEGACY_KEY='reach-planner-v1';
const defaults={
  name:'Student',
  energy:'steady',
  points:0,
  focusMinutes:15,
  breakMinutes:10,
  recharge:'Make tea',
  customRecharge:'',
  theme:'light',
  notifications:true,
  calendarConnected:false,
  semester:'',
  units:[],
  assignments:[],
  commitments:[],
  activity:[
    {day:'M',mins:0},{day:'T',mins:0},{day:'W',mins:0},
    {day:'T',mins:0},{day:'F',mins:0},{day:'S',mins:0},{day:'S',mins:0}
  ]
};
let state=load();let screen='home';let selectedAssignmentId=state.assignments?.[0]?.id||null;let selectedUnitCode=state.units?.[0]?.code||null;let focusTimer=null,remaining=state.focusMinutes*60;
function load(){try{const raw=localStorage.getItem(KEY)||localStorage.getItem(LEGACY_KEY)||'{}';const parsed=JSON.parse(raw);const merged=Object.assign(structuredClone(defaults),parsed);merged.units=Array.isArray(parsed.units)?parsed.units:structuredClone(defaults.units);if(!['light','dark'].includes(merged.theme))merged.theme='light';if(typeof merged.customRecharge!=='string')merged.customRecharge='';return merged}catch{return structuredClone(defaults)}}
function applyTheme(){document.documentElement.classList.toggle('dark',state.theme==='dark');const meta=document.querySelector('meta[name=theme-color]');if(meta)meta.setAttribute('content',state.theme==='dark'?'#0b130f':'#234f2c')}
function save(){localStorage.setItem(KEY,JSON.stringify(state));applyTheme();const pill=document.getElementById('syncPill');if(pill)pill.textContent='Saved on this device'}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function nav(to){screen=to;render();window.scrollTo({top:0,behavior:'smooth'})}
function fmtDue(v){const d=new Date(v);return d.toLocaleString('en-AU',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
function doneCount(a){return a.steps.filter(s=>s[2]).length}
function minsRemaining(a){return a.steps.filter(s=>!s[2]).reduce((n,s)=>n+s[1],0)}
function nextStep(){for(const a of state.assignments){const i=a.steps.findIndex(s=>!s[2]);if(i>=0)return{a,i,s:a.steps[i]}}return null}
function totalPlanned(){return state.assignments.reduce((n,a)=>n+minsRemaining(a),0)}
function esc(v=''){return String(v).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function selectedAssignment(){return state.assignments.find(a=>a.id===selectedAssignmentId)||state.assignments[0]||null}

function selectedUnit(){return state.units.find(u=>u.code===selectedUnitCode)||state.units[0]||null}
function classifyAssessment(title=''){const x=String(title).toLowerCase();if(/exam|test/.test(x))return'Exam';if(/quiz/.test(x))return'Quiz';if(/presentation|oral|pitch/.test(x))return'Presentation';if(/report|case study/.test(x))return'Report';if(/essay|paper|literature review/.test(x))return'Essay';if(/portfolio/.test(x))return'Portfolio';if(/reflection|reflective/.test(x))return'Reflection';if(/problem set|worksheet/.test(x))return'Problem set';if(/project|proposal/.test(x))return'Project';return'Assessment'}
function stepsForType(type='Assessment'){const t=type.toLowerCase();if(/exam|quiz|test/.test(t))return[['Review topics & requirements',25,false],['Create revision notes',45,false],['Practice questions',60,false],['Review weak areas',45,false],['Final revision',30,false]];if(/presentation/.test(t))return[['Review brief & criteria',20,false],['Research key points',45,false],['Plan slide/story flow',35,false],['Build slides',75,false],['Rehearse',40,false],['Final check',20,false]];if(/essay|report|reflection|portfolio|project/.test(t))return[['Review brief & marking criteria',20,false],['Find useful sources',45,false],['Organise notes',30,false],['Create structure',45,false],['Draft one section at a time',90,false],['Final review & submit',40,false]];return[['Review requirements',20,false],['Gather materials',30,false],['Complete first section',45,false],['Continue task',60,false],['Review & submit',30,false]]}
function parseOutlineDate(raw=''){const s=String(raw);const monthMap={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};let m=s.match(/\b(\d{1,2})\s+(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)[,\s]+(\d{4})\b/i);if(m){const mo=monthMap[m[2].toLowerCase()];return`${m[3]}-${String(mo).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`}m=s.match(/\b(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})\b/);if(m)return`${m[3]}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;return''}
function parseOutlineTime(raw=''){const m=String(raw).match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);if(m){let h=+m[1];const min=m[2]||'00';if(m[3].toLowerCase()==='pm'&&h<12)h+=12;if(m[3].toLowerCase()==='am'&&h===12)h=0;return`${String(h).padStart(2,'0')}:${min}`}const t=String(raw).match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);return t?`${String(+t[1]).padStart(2,'0')}:${t[2]}`:'17:00'}
function cleanAssessmentTitle(s=''){return String(s).replace(/^\s*(assessment|task)\s*\d*\s*[:\-–]?\s*/i,'').replace(/\s+/g,' ').trim().slice(0,100)}
function detectAssessmentsFromText(text=''){const lines=String(text).split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);const out=[];const key=/\b(assessment\s*\d*|assignment\s*\d*|essay|report|quiz|exam|presentation|portfolio|reflection|project|problem set|case study|proposal|test)\b/i;for(let i=0;i<lines.length;i++){const line=lines[i];if(!key.test(line)||line.length>170)continue;if(/assessment (policy|extension|appeal|feedback|moderation|security|information)/i.test(line))continue;const nearby=lines.slice(Math.max(0,i-1),Math.min(lines.length,i+6)).join(' ');const weightMatch=nearby.match(/\b(\d{1,3}(?:\.\d+)?)\s*%/);const date=parseOutlineDate(nearby);let title=cleanAssessmentTitle(line);if(!title||/^(assessment|assignment|task)\s*\d*$/i.test(line)){const next=lines[i+1]||'';if(next.length<120&&!/%|due|week\s*\d+/i.test(next))title=cleanAssessmentTitle(next)}if(!title)title=`Assessment ${out.length+1}`;const type=classifyAssessment(title);const item={title,type,weight:weightMatch?Math.min(100,+weightMatch[1]):'',dueDate:date,dueTime:parseOutlineTime(nearby)};if(!out.some(x=>x.title.toLowerCase()===item.title.toLowerCase()&&x.dueDate===item.dueDate))out.push(item)}return out.slice(0,12)}
async function extractOutlinePdf(file){if(!file)return{text:'',assessments:[]};if(file.type==='text/plain'||file.name.toLowerCase().endsWith('.txt')){const text=await file.text();return{text,assessments:detectAssessmentsFromText(text)}}if(!file.name.toLowerCase().endsWith('.pdf'))throw new Error('Automatic outline reading currently supports PDF and TXT files.');if(!window.pdfjsLib)throw new Error('PDF reader could not load. Check your internet connection and try again.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const data=new Uint8Array(await file.arrayBuffer());const pdf=await pdfjsLib.getDocument({data}).promise;let lines=[];for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);const content=await page.getTextContent();const buckets=new Map();for(const item of content.items){const y=Math.round((item.transform?.[5]||0)/2)*2;const arr=buckets.get(y)||[];arr.push({x:item.transform?.[4]||0,s:item.str||''});buckets.set(y,arr)}const pageLines=[...buckets.entries()].sort((a,b)=>b[0]-a[0]).map(([,arr])=>arr.sort((a,b)=>a.x-b.x).map(x=>x.s).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean);lines.push(...pageLines)}const text=lines.join('\n');if(text.trim().length<40)throw new Error('This PDF appears to be scanned/image-based, so no readable text was found. Add the assessments manually or upload a text-based PDF.');return{text,assessments:detectAssessmentsFromText(text)}}
function assessmentEditorRow(a={},i=0){const types=['Essay','Report','Presentation','Quiz','Exam','Portfolio','Reflection','Problem set','Project','Assessment'];return`<div class="assessment-extract" data-assessment-row><div class="extract-grid"><div class="field"><label>Assessment title</label><input class="input" data-a="title" value="${esc(a.title||'')}" placeholder="Assessment title"></div><div class="field"><label>Type</label><select class="select" data-a="type">${types.map(x=>`<option ${a.type===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="extract-meta"><div class="field"><label>Weight %</label><input class="input" type="number" min="0" max="100" data-a="weight" value="${a.weight??''}" placeholder="—"></div><div class="field"><label>Due date</label><input class="input" type="date" data-a="date" value="${a.dueDate||''}"></div><div class="field"><label>Due time</label><input class="input" type="time" data-a="time" value="${a.dueTime||'17:00'}"></div></div><button class="btn btn-outline" type="button" data-remove-extracted="${i}" style="margin-top:10px">Remove suggestion</button></div>`}
function render(){applyTheme();document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===screen));const el=document.getElementById('screen');el.innerHTML=views[screen]?views[screen]():views.home();wire(el);el.focus({preventScroll:true})}
function assignmentCard(a,expanded=false){const dc=doneCount(a),pct=Math.round(dc/a.steps.length*100);return `<div class="assignment"><div class="assignment-head"><div><span class="eyebrow">${esc(a.unit)}</span><h3>${esc(a.title)}</h3><div class="sub">Due ${fmtDue(a.due)} · ${a.weight}% weighting</div></div><span class="status">${dc===a.steps.length?'Complete':'In progress'}</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="sub">${dc} of ${a.steps.length} steps done · ~${minsRemaining(a)} min left</div>${expanded?`<div class="small-steps">${a.steps.map((s,i)=>`<div class="step ${s[2]?'done':''}"><button class="check ${s[2]?'done':''}" data-step="${a.id}:${i}">${s[2]?'✓':''}</button><div class="row-main"><strong>${s[0]}</strong><small>${s[1]} min</small></div></div>`).join('')}</div><button class="btn btn-primary" style="width:100%;margin-top:14px" data-focus="1">▹ Start a ${state.focusMinutes}-min focus</button>`:`<div class="toolbar" style="margin-top:14px"><button class="btn btn-outline" data-open-assignment="${a.id}">View plan</button></div>`}</div>`}
const views={
home(){const n=nextStep();return `<div class="page-head"><div><div class="eyebrow">${new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Your space to grow.</h1><div class="sub">A little structure. A lot of breathing room.</div></div><button class="btn btn-primary" data-nav="add-assignment">＋ Add assignment</button></div><section class="hero"><div><h2>Good morning${state.name&&state.name!=='Student'?`, ${esc(state.name)}`:''}.</h2><div class="sub">You don't have to do it all. Let's start small.</div>${n?`<div class="next-action"><div class="eyebrow">Your next small step · ${n.s[1]} min</div><h3 style="margin:6px 0">${n.s[0]}</h3><small>${n.a.title} · Rough is enough.</small></div><button class="btn btn-primary" style="margin-top:16px;width:100%" data-focus="1">▹ Start a ${state.focusMinutes}-min focus</button>`:''}</div><div class="hero-art"><img src="assets/favicon.svg" alt="REACH growth illustration"></div></section><div class="grid g2" style="margin-top:16px"><div class="card metric"><div class="eyebrow">Weekly study capacity</div><strong>6h 30m</strong><div class="progress-track"><div class="progress-fill" style="width:72%"></div></div><div class="sub">of 9h available · 2h 30m free</div></div><div class="card metric" style="background:linear-gradient(135deg,var(--lav),var(--blue))"><div class="eyebrow">Growth points</div><strong>${state.points}</strong><div class="sub">Small steps, real growth.</div></div></div><div class="card" style="margin-top:16px"><div class="page-head" style="margin-bottom:8px"><h2>Active assignments</h2><button class="btn btn-soft" data-nav="assignments">View all</button></div><div class="list">${state.assignments.slice(0,3).map(a=>`<div class="row"><div class="row-main"><strong>${esc(a.title)}</strong><small>${esc(a.unit)} · ${fmtDue(a.due)}</small></div><button class="btn btn-outline" data-open-assignment="${a.id}">›</button></div>`).join('')}</div></div><h2 style="margin-top:22px">Make it easier</h2><div class="quick-grid"><button class="quick" data-nav="add-assignment">＋<b>Add assignment</b></button><button class="quick" data-nav="planner">▦<b>Find study time</b></button><button class="quick" data-nav="focus">☕<b>Take a break</b></button></div><button class="btn btn-outline setup-link" data-nav="semester-setup">Manage units & outlines</button>`},
today(){const n=nextStep();return `<div class="eyebrow">Today</div><h1>One thing at a time.</h1><div class="sub">Only the next useful actions are shown here.</div><div class="energy" style="margin:18px 0"><span class="sub">How's your energy?</span>${['low','steady','high'].map(x=>`<button class="chip ${state.energy===x?'active':''}" data-energy="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>${n?`<div class="focus-card"><div class="eyebrow">A little headway</div><h2 style="margin-top:8px">${n.s[0]}</h2><div class="sub">${n.a.title}</div><div class="timer-ring" style="--p:25"><span>${String(state.focusMinutes).padStart(2,'0')}:00</span></div><button class="btn btn-primary" style="width:100%" data-focus="1">▹ Start a ${state.focusMinutes}-min focus</button></div>`:''}<h2 style="margin-top:22px">Your gentle agenda</h2><div class="card"><div class="list">${state.commitments.slice(0,5).map(c=>`<div class="row"><span class="status ${c.kind==='break'?'yellow':c.kind==='class'?'blue':''}">${c.time}</span><div class="row-main"><strong>${c.title}</strong><small>${c.day}</small></div></div>`).join('')}</div></div><div class="notice" style="margin-top:16px">16:00–16:30 · Open space. Check your statistics answer, or leave this as breathing room.</div>`},
assignments(){return `<div class="page-head"><div><div class="eyebrow">Assignments</div><h1>Big briefs. Small steps.</h1><div class="sub">Understand it. Break it down. Make it yours.</div></div><button class="btn btn-primary" data-nav="add-assignment">＋ Add assignment</button></div><div class="toolbar" style="margin-bottom:16px"><button class="chip active">Active · ${state.assignments.length}</button><button class="chip">Completed · ${state.assignments.filter(a=>doneCount(a)===a.steps.length).length}</button></div>${state.assignments.map((a,i)=>assignmentCard(a,i===0)).join('')}`},
planner(){const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];return `<div class="page-head"><div><div class="eyebrow">Planner</div><h1>A plan that fits you.</h1><div class="sub">Build around your life, not the other way round.</div></div><button class="btn btn-soft" data-nav="availability">Edit availability</button></div><div class="card" style="background:linear-gradient(135deg,#20552f,#36783f);color:white"><div class="eyebrow" style="color:#c9f5d2">Room for real life</div><strong style="font-size:34px;display:block;margin:6px 0">6h 30m</strong><div>of 9h available · 2h 30m free</div></div><div class="week" style="margin-top:16px">${days.map((d,idx)=>`<div class="day ${idx===2?'today':''}"><strong>${d}</strong>${state.commitments.filter(c=>c.day===d).map(c=>`<div class="event ${c.kind}"><b>${c.time}</b><br>${c.title}</div>`).join('')}${idx===4?`<div class="event study"><b>15:00</b><br>Draft comparison</div>`:''}</div>`).join('')}</div><div class="callout"><h3>Let's spread things out</h3><p>Short blocks, a little buffer, no cramming.</p><button class="btn btn-primary" data-nav="today">▹ Start a ${state.focusMinutes}-min focus</button></div>`},
progress(){return `<div class="eyebrow">Progress</div><h1>Look how far you've grown.</h1><div class="sub">Progress is more than a finished assignment.</div><div class="card" style="margin-top:18px;background:linear-gradient(135deg,#e3f5e8,#eff2fc)"><div class="eyebrow">Your growth points</div><strong style="font-size:54px">${state.points}</strong><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,state.points/3)}%"></div></div><div class="sub">Next bloom at 300 points.</div></div><div class="kpi-grid" style="margin-top:14px"><div class="kpi"><strong>${state.assignments.reduce((n,a)=>n+doneCount(a),0)}</strong><span>Small steps done</span></div><div class="kpi"><strong>3/5</strong><span>Focus sessions</span></div><div class="kpi"><strong>75m</strong><span>Little wins</span></div><div class="kpi"><strong>3</strong><span>Recharge breaks</span></div></div><div class="card" style="margin-top:16px"><h2>A week of little wins</h2><div class="bar-chart">${state.activity.map((x,i)=>`<div class="bar ${x.mins?'active':''}" style="height:${30+x.mins*1.6}px"><span>${x.day}</span></div>`).join('')}</div></div><div class="reward" style="margin-top:16px"><div class="eyebrow">A moment just for you</div><h3>Your favourite café break</h3><p class="sub">200 points · A reward you chose</p><button class="btn btn-primary" data-nav="focus">Start a focus session</button></div>`},
'add-assignment'(){return `<div class="wizard"><div class="eyebrow">Add assignment · 1 / 3</div><h1>Start with the basics.</h1><div class="sub">One assignment. Three small steps.</div><div class="steps"><div class="on"></div><div></div><div></div></div><div class="card"><form id="assignmentDetails"><div class="field"><label>Unit</label><select class="select" name="unit">${state.units.map(u=>`<option value="${u.code}">${u.code} · ${u.name}</option>`).join('')}</select></div><div class="field"><label>Assignment title</label><input class="input" name="title" required placeholder="e.g. Research methods essay"></div><div class="grid g2"><div class="field"><label>Assignment type</label><select class="select" name="type"><option>Essay</option><option>Report</option><option>Presentation</option><option>Problem set</option><option>Project</option></select></div><div class="field"><label>Weighting</label><input class="input" type="number" min="0" max="100" name="weight" value="30"></div></div><div class="grid g2"><div class="field"><label>Due date</label><input class="input" type="date" name="date" required></div><div class="field"><label>Due time</label><input class="input" type="time" name="time" value="17:00"></div></div><button class="btn btn-primary" type="submit">Next →</button></form></div><div class="notice" style="margin-top:16px">This tool helps you understand and plan your assignment. It does not write the assignment for you.</div></div>`},
'add-brief'(){return `<div class="wizard"><div class="eyebrow">Add assignment · 2 / 3</div><h1>Keep the brief close.</h1><div class="steps"><div class="on"></div><div class="on"></div><div></div></div><div class="card"><form id="assignmentBrief"><div class="field"><label>Upload brief (optional)</label><div class="file-box"><input type="file" name="file" accept=".pdf,.doc,.docx,.txt"></div></div><div class="field"><label>Paste assignment brief or key instructions</label><textarea class="textarea" name="brief" required placeholder="Paste the instructions here..."></textarea></div><div class="toolbar"><button class="btn btn-outline" type="button" data-nav="add-assignment">← Back</button><button class="btn btn-primary" type="submit">Next →</button></div></form></div></div>`},
'add-understanding'(){return `<div class="wizard"><div class="eyebrow">Add assignment · 3 / 3</div><h1>What does it mean to you?</h1><div class="steps"><div class="on"></div><div class="on"></div><div class="on"></div></div><div class="card"><form id="assignmentUnderstanding"><div class="field"><label>In your own words, what do you think this assignment is asking you to do?</label><textarea class="textarea" name="understanding" required placeholder="A few rough sentences or bullet points are enough."></textarea></div><div class="callout">If it helps, think about: What do you need to produce? What should you explain or compare? What feels unclear?</div><div class="toolbar" style="margin-top:14px"><button class="btn btn-outline" type="button" data-nav="add-brief">← Back</button><button class="btn btn-primary" type="submit">Check my understanding →</button></div></form></div></div>`},
'understanding-check'(){const d=state.draft||{};return `<div class="wizard"><div class="eyebrow">Understanding check</div><h1>A little more clarity.</h1><div class="card"><div class="notice"><strong>You're on the right track.</strong><br>Your summary identifies the task, expected output and the need to use evidence.</div><h3 style="margin-top:18px">Your understanding</h3><p>${d.understanding||'You need to complete the task in your own words and follow the marking requirements.'}</p><div class="callout"><strong>You may also need to consider</strong><br>Check the marking criteria, word count, referencing expectations and whether any required sources are specified.</div><button class="btn btn-primary" style="margin-top:16px" data-create-plan="1">Create my plan →</button></div></div>`},
'plan-view'(){const a=selectedAssignment();if(!a)return `<div class="empty"><h2>No assignment selected</h2><p>Add an assignment first.</p><button class="btn btn-primary" data-nav="add-assignment">Add assignment</button></div>`;return `<div class="eyebrow">Assignment plan</div><h1>Small steps. Room to breathe.</h1>${assignmentCard(a,true)}<div class="card" style="margin-top:16px"><h2>Suggested study plan</h2><div class="row"><strong>Today</strong><div class="row-main"></div><span>Review the brief · 20 min</span></div><div class="row"><strong>This week</strong><div class="row-main"></div><span>Sources + notes · 1h 15m</span></div><div class="row"><strong>Next week</strong><div class="row-main"></div><span>Structure + draft · 2h 15m</span></div><div class="row"><strong>Final review</strong><div class="row-main"></div><span>Proofread + submit · 40 min</span></div><button class="btn btn-primary" data-nav="planner">Add plan to planner</button></div>`},

'semester-setup'(){return `<div class="wizard"><div class="eyebrow">Units & outlines</div><h1>Your units.</h1><div class="sub">Open a unit to see its assessments and deadlines, or upload an outline to build them automatically.</div><div class="card" style="margin-top:18px"><div class="page-head" style="margin-bottom:8px"><div><h2>Current units</h2><div class="sub">Tap a unit to open it.</div></div><button class="btn btn-soft" data-nav="outline-upload">＋ Add / upload</button></div>${state.units.length?state.units.map((u,i)=>`<div class="row unit-row"><button class="unit-open" data-open-unit="${esc(u.code)}"><div class="row-main"><strong>${esc(u.code)} · ${esc(u.name)}</strong><div class="unit-meta">${u.outlineConfirmed?`<span class="status">Outline confirmed</span>`:`<span class="status yellow">Outline not added</span>`}<span class="status blue">${state.assignments.filter(a=>a.unit===u.code).length} assessments</span></div></div><span class="chevron">›</span></button><button class="btn btn-outline" data-remove-unit="${i}">Remove</button></div>`).join(''):`<div class="empty">No units yet.</div>`}<form id="setupUnitForm" class="grid g2" style="margin-top:14px"><input class="input" name="code" placeholder="Unit code" required><input class="input" name="name" placeholder="Unit name" required><button class="btn btn-primary" style="grid-column:1/-1">Add unit</button></form></div><button class="btn btn-primary flow-next" data-nav="outline-upload">Upload a unit outline →</button></div>`},
'outline-upload'(){const hasUnits=state.units.length>0;return `<div class="wizard"><div class="eyebrow">Unit outline · 1 / 2</div><h1>Bring your unit into focus.</h1><div class="sub">Choose an existing unit or add a new one here, then attach the outline for review.</div><div class="card" style="margin-top:18px"><form id="outlineForm">${hasUnits?`<div class="field"><label>Existing unit</label><select class="select" name="unit"><option value="">Choose a unit</option>${state.units.map(u=>`<option value="${esc(u.code)}">${esc(u.code)} · ${esc(u.name)}</option>`).join('')}</select></div><div class="divider"></div>`:''}<div class="eyebrow">Or add a new unit</div><div class="grid g2" style="margin-top:10px"><div class="field"><label>Unit code</label><input class="input" name="newCode" placeholder="e.g. PSY204"></div><div class="field"><label>Unit name</label><input class="input" name="newName" placeholder="e.g. Research Methods"></div></div><div class="field"><label>Unit outline</label><div class="file-box"><input type="file" name="file" accept=".pdf,.doc,.docx,.txt"></div></div><div class="notice">The document itself stays on this device. The confirmed unit and outline details are saved in your planner.</div><button class="btn btn-primary" type="submit">Review unit outline →</button></form></div></div>`},
'outline-review'(){const o=state.outlineDraft||{};return `<div class="wizard"><div class="eyebrow">Unit outline · 2 / 2</div><h1>A quick check, then you decide.</h1><div class="sub">Confirm the unit details below. They will be saved into your Units section.</div><div class="card" style="margin-top:18px"><div class="field"><label>Unit code</label><input class="input" id="outlineCode" value="${esc(o.code||'')}"></div><div class="field"><label>Unit name</label><input class="input" id="outlineName" value="${esc(o.name||'')}"></div><div class="field"><label>Teaching period</label><input class="input" id="outlinePeriod" value="${esc(o.period||state.semester)}"></div><div class="notice"><strong>Outline selected</strong><br>${esc(o.fileName||'No file selected')}</div><div class="callout" style="margin-top:12px">Academic integrity: this tool helps organise and plan assessment information. It does not write assessment work.</div><div class="toolbar" style="margin-top:14px"><button class="btn btn-outline" data-nav="outline-upload">← Back</button><button class="btn btn-primary" id="confirmOutline">Save unit & continue</button></div></div></div>`},
availability(){return `<div class="eyebrow">Availability & commitments</div><h1>Make room for real life.</h1><div class="sub">Tell the planner when you're busy, so study suggestions fit around your week.</div><div class="grid g2" style="margin-top:18px"><div class="card"><h2>Add commitment</h2><form id="commitmentForm"><div class="field"><label>Day</label><select class="select" name="day">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<option>${d}</option>`).join('')}</select></div><div class="field"><label>Time</label><input class="input" type="time" name="time" required></div><div class="field"><label>Commitment</label><input class="input" name="title" placeholder="Work, class, gym, appointment..." required></div><button class="btn btn-primary">Add commitment</button></form></div><div class="card"><h2>Calendar connection</h2><div class="sub">For this release, you can import an .ics calendar file. No account password is shared with REACH.</div><div class="file-box calendar-import"><input id="icsInput" type="file" accept=".ics,text/calendar"></div><div class="notice" style="margin-top:12px">${state.calendarConnected?'Calendar imported for this device.':'Optional. Your planner works without a calendar connection.'}</div></div></div><div class="card" style="margin-top:16px"><h2>Your recurring commitments</h2>${state.commitments.map((c,i)=>`<div class="row"><span class="status">${c.day} ${c.time}</span><div class="row-main"><strong>${c.title}</strong></div><button class="btn btn-outline" data-remove-commitment="${i}">Remove</button></div>`).join('')}</div>`},
focus(){const presets=['Make tea','Go for a walk','Stretch','Read comics','Listen to music','Water plants','Play a short game'];const isCustom=!presets.includes(state.recharge);return `<div class="wizard"><div class="eyebrow">Focus & recharge</div><h1>One small block.</h1><div class="focus-card"><div class="timer-ring" id="timerRing" style="--p:0"><span id="timerText">${formatTimer(remaining)}</span></div><div class="toolbar" style="justify-content:center"><button class="btn btn-primary" id="timerStart">Start</button><button class="btn btn-outline" id="timerPause">Pause</button><button class="btn btn-outline" id="timerReset">Reset</button></div></div><div class="card" style="margin-top:16px"><h2>Recharge your way</h2><div class="field"><label>After a focus block, I like to...</label><select class="select" id="rechargeSelect">${presets.map(x=>`<option ${state.recharge===x?'selected':''}>${x}</option>`).join('')}<option value="__custom__" ${isCustom?'selected':''}>Something else…</option></select></div><div class="field custom-recharge" id="customRechargeWrap" style="display:${isCustom?'grid':'none'}"><label>My recharge activity</label><input class="input" id="customRecharge" maxlength="60" value="${esc(isCustom?state.recharge:state.customRecharge||'')}" placeholder="e.g. sit outside, doodle, call a friend"></div><div class="grid g2"><div class="field"><label>Focus duration</label><input class="input" id="focusMinutes" type="number" min="5" max="90" value="${state.focusMinutes}"></div><div class="field"><label>Break duration</label><input class="input" id="breakMinutes" type="number" min="1" max="60" value="${state.breakMinutes}"></div></div><div class="notice">Your recharge choice is personal. Pick anything safe and realistic that helps you reset.</div><button class="btn btn-primary" id="saveRhythm" style="margin-top:12px;width:100%">Save my rhythm</button></div></div>`},
settings(){return `<div class="eyebrow">Profile & settings</div><h1>Make the planner yours.</h1><div class="grid g2"><div class="card"><h2>Profile</h2><div class="field"><label>First name</label><input class="input" id="nameInput" value="${esc(state.name)}"></div><div class="field"><label>Semester</label><input class="input" id="semesterInput" value="${esc(state.semester)}"></div><button class="btn btn-primary" id="saveProfile">Save profile</button></div><div class="card"><h2>Preferences</h2><div class="settings-list"><div class="setting"><div><strong>Appearance</strong><div class="sub">Choose the look that feels easiest to use.</div></div><div class="theme-choice"><button class="chip ${state.theme==='light'?'active':''}" data-theme="light">☀ Light</button><button class="chip ${state.theme==='dark'?'active':''}" data-theme="dark">☾ Dark</button></div></div><div class="divider"></div><div class="setting"><div><strong>Gentle reminders</strong><div class="sub">Supportive, not nagging.</div></div><button class="switch ${state.notifications?'on':''}" id="notifSwitch" aria-label="Toggle reminders"></button></div><div class="divider"></div><div class="setting"><div><strong>Data storage</strong><div class="sub">This release keeps your working data on this device.</div></div><span class="status">Local-first</span></div></div></div></div><div class="card" style="margin-top:16px"><div class="page-head" style="margin-bottom:8px"><div><h2>Units</h2><div class="sub">Confirmed unit outlines stay attached to their unit.</div></div><button class="btn btn-soft" data-nav="outline-upload">＋ Add / upload</button></div>${state.units.length?state.units.map((u,i)=>`<div class="row"><div class="row-main"><strong>${esc(u.code)} · ${esc(u.name)}</strong><div class="unit-meta">${u.outlineConfirmed?`<span class="status">Outline confirmed</span>`:`<span class="status yellow">Outline not added</span>`}${u.outlineFile?`<span class="status blue">${esc(u.outlineFile)}</span>`:''}</div>${u.teachingPeriod?`<small>${esc(u.teachingPeriod)}</small>`:''}</div><button class="btn btn-outline" data-remove-unit="${i}">Remove</button></div>`).join(''):`<div class="empty">No units yet. Add your first unit and outline.</div>`}<form id="unitForm" class="grid g3" style="margin-top:14px"><input class="input" name="code" placeholder="Unit code" required><input class="input" name="name" placeholder="Unit name" required><button class="btn btn-primary">Add unit</button></form></div><div class="card" style="margin-top:16px"><h2>Data & handover</h2><div class="sub">Export a backup before changing devices. The file contains planner data only.</div><div class="toolbar" style="margin-top:12px"><button class="btn btn-soft" id="exportData">Export backup</button><label class="btn btn-outline">Import backup<input id="importData" type="file" accept="application/json" hidden></label><button class="btn btn-danger" id="resetData">Reset demo data</button></div></div>`}}

function formatTimer(sec){return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function wire(root){root.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.nav)));root.querySelectorAll('[data-open-assignment]').forEach(b=>b.addEventListener('click',()=>{selectedAssignmentId=Number(b.dataset.openAssignment);nav('plan-view')}));root.querySelectorAll('[data-focus]').forEach(b=>b.addEventListener('click',()=>nav('focus')));root.querySelectorAll('[data-energy]').forEach(b=>b.addEventListener('click',()=>{state.energy=b.dataset.energy;save();render()}));root.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{const[a,i]=b.dataset.step.split(':').map(Number);const as=state.assignments.find(x=>x.id===a);as.steps[i][2]=!as.steps[i][2];if(as.steps[i][2])state.points+=10;save();render()}));
const f1=root.querySelector('#assignmentDetails');if(f1)f1.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(f1);state.draft={unit:fd.get('unit'),title:fd.get('title'),type:fd.get('type'),weight:+fd.get('weight'),date:fd.get('date'),time:fd.get('time')};save();nav('add-brief')});const f2=root.querySelector('#assignmentBrief');if(f2)f2.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(f2);state.draft=Object.assign(state.draft||{},{brief:fd.get('brief'),fileName:fd.get('file')?.name||''});save();nav('add-understanding')});const f3=root.querySelector('#assignmentUnderstanding');if(f3)f3.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(f3);state.draft=Object.assign(state.draft||{},{understanding:fd.get('understanding')});save();nav('understanding-check')});root.querySelectorAll('[data-create-plan]').forEach(b=>b.addEventListener('click',()=>{const d=state.draft;if(d?.title){const newId=Date.now();state.assignments.unshift({id:newId,unit:d.unit,title:d.title,due:`${d.date}T${d.time||'17:00'}`,weight:d.weight,type:d.type,brief:d.brief||'',steps:[['Review brief & marking criteria',20,false],['Find useful sources',45,false],['Organise notes',30,false],['Create structure',45,false],['Draft one section at a time',90,false],['Final review & submit',40,false]]});selectedAssignmentId=newId;state.draft=null;save();toast('Assignment plan created')}nav('assignments')}));const suf=root.querySelector('#setupUnitForm');if(suf)suf.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(suf);const code=String(fd.get('code')||'').trim().toUpperCase();const name=String(fd.get('name')||'').trim();if(code&&name&&!state.units.some(u=>u.code===code)){state.units.push({code,name});state.semester=root.querySelector('#setupSemester')?.value.trim()||state.semester;save();toast('Unit added');render()}});const of=root.querySelector('#outlineForm');if(of)of.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(of);const existingCode=String(fd.get('unit')||'').trim();const newCode=String(fd.get('newCode')||'').trim().toUpperCase();const newName=String(fd.get('newName')||'').trim();let code=newCode||existingCode;let existing=state.units.find(u=>u.code===code);let name=newName||(existing?.name||'');if(!code){toast('Choose an existing unit or enter a new unit code');return}if(newCode&&!newName&&!existing){toast('Enter a name for the new unit');return}if(newCode&&newName&&!existing){state.units.push({code:newCode,name:newName,outlineConfirmed:false});existing=state.units[state.units.length-1]}state.outlineDraft={code,name:name||existing?.name||code,fileName:fd.get('file')?.name||'',period:state.semester};save();nav('outline-review')});const co=root.querySelector('#confirmOutline');if(co)co.addEventListener('click',()=>{const code=(root.querySelector('#outlineCode')?.value||'').trim().toUpperCase();const name=(root.querySelector('#outlineName')?.value||'').trim();const period=(root.querySelector('#outlinePeriod')?.value||state.semester).trim();if(!code||!name){toast('Unit code and name are required');return}let unit=state.units.find(u=>u.code===code);if(!unit){unit={code,name};state.units.push(unit)}unit.name=name;unit.outlineConfirmed=true;unit.outlineFile=state.outlineDraft?.fileName||unit.outlineFile||'';unit.teachingPeriod=period;unit.outlineConfirmedAt=new Date().toISOString();state.semester=period;state.outlineConfirmed=true;state.outlineDraft=null;save();toast(`${code} saved to Units`);nav('settings')});const cf=root.querySelector('#commitmentForm');if(cf)cf.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(cf);state.commitments.push({day:fd.get('day'),time:fd.get('time'),title:fd.get('title'),kind:'personal'});save();toast('Commitment added');render()});root.querySelectorAll('[data-remove-commitment]').forEach(b=>b.addEventListener('click',()=>{state.commitments.splice(+b.dataset.removeCommitment,1);save();render()}));const ics=root.querySelector('#icsInput');if(ics)ics.addEventListener('change',async()=>{const file=ics.files[0];if(!file)return;const text=await file.text();const lines=text.split(/\r?\n/);let current={};let added=0;for(const line of lines){if(line==='BEGIN:VEVENT')current={};else if(line.startsWith('SUMMARY:'))current.title=line.slice(8);else if(line.startsWith('DTSTART')){const v=line.split(':').pop();if(v&&/^\d{8}T?\d{0,6}/.test(v)){const day=new Date(`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}T${v.includes('T')?`${v.slice(9,11)||'09'}:${v.slice(11,13)||'00'}`:'09:00'}`);current.day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][day.getDay()];current.time=`${String(day.getHours()).padStart(2,'0')}:${String(day.getMinutes()).padStart(2,'0')}`}}else if(line==='END:VEVENT'&&current.title&&current.day){state.commitments.push({day:current.day,time:current.time||'09:00',title:current.title,kind:'calendar'});added++}}state.calendarConnected=true;save();toast(`Imported ${added} calendar item${added===1?'':'s'}`);render()});root.querySelectorAll('[data-remove-unit]').forEach(b=>b.addEventListener('click',()=>{state.units.splice(+b.dataset.removeUnit,1);save();render()}));const uf=root.querySelector('#unitForm');if(uf)uf.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(uf);const code=String(fd.get('code')||'').trim().toUpperCase();const name=String(fd.get('name')||'').trim();if(!code||!name)return;if(state.units.some(u=>u.code===code)){toast('That unit already exists');return}state.units.push({code,name,outlineConfirmed:false});save();toast('Unit added');render()});const sp=root.querySelector('#saveProfile');if(sp)sp.addEventListener('click',()=>{state.name=root.querySelector('#nameInput').value.trim()||'Student';state.semester=root.querySelector('#semesterInput').value.trim();save();toast('Profile saved')});root.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{state.theme=b.dataset.theme;save();render();toast(`${b.dataset.theme==='dark'?'Dark':'Light'} mode on`)}));const ns=root.querySelector('#notifSwitch');if(ns)ns.addEventListener('click',()=>{state.notifications=!state.notifications;save();render()});const exp=root.querySelector('#exportData');if(exp)exp.addEventListener('click',()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='REACH-Student-Planner-backup.json';a.click();URL.revokeObjectURL(a.href)});const imp=root.querySelector('#importData');if(imp)imp.addEventListener('change',async()=>{try{state=JSON.parse(await imp.files[0].text());save();toast('Backup imported');render()}catch{toast('That backup file could not be read')}});const reset=root.querySelector('#resetData');if(reset)reset.addEventListener('click',()=>{if(confirm('Reset planner to demo data?')){state=structuredClone(defaults);save();render()}});const ts=root.querySelector('#timerStart'),tp=root.querySelector('#timerPause'),tr=root.querySelector('#timerReset');if(ts)ts.addEventListener('click',()=>{clearInterval(focusTimer);focusTimer=setInterval(()=>{remaining=Math.max(0,remaining-1);const txt=document.getElementById('timerText');if(txt)txt.textContent=formatTimer(remaining);const ring=document.getElementById('timerRing');if(ring)ring.style.setProperty('--p',100-(remaining/(state.focusMinutes*60))*100);if(remaining===0){clearInterval(focusTimer);focusTimer=null;state.points+=30;state.activity[2].mins+=state.focusMinutes;save();toast('Focus complete · +30 growth points')}},1000)});if(tp)tp.addEventListener('click',()=>clearInterval(focusTimer));if(tr)tr.addEventListener('click',()=>{clearInterval(focusTimer);remaining=state.focusMinutes*60;render()});const rs=root.querySelector('#rechargeSelect');if(rs)rs.addEventListener('change',()=>{const w=root.querySelector('#customRechargeWrap');if(w)w.style.display=rs.value==='__custom__'?'grid':'none'});const sr=root.querySelector('#saveRhythm');if(sr)sr.addEventListener('click',()=>{state.focusMinutes=Math.max(5,Math.min(90,+root.querySelector('#focusMinutes').value||15));state.breakMinutes=Math.max(1,Math.min(60,+root.querySelector('#breakMinutes').value||10));const choice=root.querySelector('#rechargeSelect').value;if(choice==='__custom__'){const custom=(root.querySelector('#customRecharge')?.value||'').trim();if(!custom){toast('Enter your recharge activity');return}state.customRecharge=custom;state.recharge=custom}else{state.recharge=choice}remaining=state.focusMinutes*60;save();toast('Focus rhythm saved')})}
applyTheme();document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.nav)));if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();

</script>
