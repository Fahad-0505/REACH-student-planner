<script>
const KEY='reach-planner-v2';
const LEGACY_KEY='reach-planner-v1';
const defaults={name:'Alex',energy:'steady',points:120,focusMinutes:15,breakMinutes:10,recharge:'Make tea',notifications:true,calendarConnected:false,semester:'Semester 2, 2026',units:[{code:'PSY204',name:'Research Methods'},{code:'STAT201',name:'Statistics'},{code:'PSY220',name:'Cognition'}],assignments:[{id:1,unit:'PSY204',title:'Research methods essay',due:'2026-11-06T17:00',weight:30,type:'Essay',brief:'Evaluate the strengths and limitations of experimental research in psychology using at least five peer-reviewed sources, with APA 7 referencing.',steps:[['Review assignment requirements',20,true],['Find 5 useful sources',45,false],['Organise research notes',30,false],['Create essay structure',45,false],['Draft one section at a time',120,false],['Review, check APA 7 and submit',45,false]]},{id:2,unit:'STAT201',title:'Statistics problem set',due:'2026-11-11T23:59',weight:20,type:'Problem set',brief:'Complete the assigned statistical problems and show working.',steps:[['Review formulas',20,true],['Complete problems 1–5',60,true],['Complete problems 6–10',60,false]]},{id:3,unit:'PSY220',title:'Cognition reading response',due:'2026-11-12T09:00',weight:15,type:'Response',brief:'Respond critically to the assigned cognition readings.',steps:[['Read article',45,false],['Write key points',30,false]]}],commitments:[{day:'Mon',time:'09:00',title:'University class',kind:'class'},{day:'Tue',time:'09:00',title:'Work roster',kind:'work'},{day:'Wed',time:'10:00',title:'Organise notes',kind:'study'},{day:'Wed',time:'17:00',title:'Gym',kind:'break'},{day:'Thu',time:'10:00',title:'Create structure',kind:'study'}],activity:[{day:'M',mins:20},{day:'T',mins:55},{day:'W',mins:0},{day:'T',mins:0},{day:'F',mins:0},{day:'S',mins:0},{day:'S',mins:0}]};
let state=load();let screen='home';let selectedAssignmentId=state.assignments?.[0]?.id||null;let focusTimer=null,remaining=state.focusMinutes*60;
function load(){try{const raw=localStorage.getItem(KEY)||localStorage.getItem(LEGACY_KEY)||'{}';const parsed=JSON.parse(raw);return Object.assign(structuredClone(defaults),parsed)}catch{return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));const pill=document.getElementById('syncPill');if(pill)pill.textContent='Saved on this device'}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function nav(to){screen=to;render();window.scrollTo({top:0,behavior:'smooth'})}
function fmtDue(v){const d=new Date(v);return d.toLocaleString('en-AU',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
function doneCount(a){return a.steps.filter(s=>s[2]).length}
function minsRemaining(a){return a.steps.filter(s=>!s[2]).reduce((n,s)=>n+s[1],0)}
function nextStep(){for(const a of state.assignments){const i=a.steps.findIndex(s=>!s[2]);if(i>=0)return{a,i,s:a.steps[i]}}return null}
function totalPlanned(){return state.assignments.reduce((n,a)=>n+minsRemaining(a),0)}
function esc(v=''){return String(v).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function selectedAssignment(){return state.assignments.find(a=>a.id===selectedAssignmentId)||state.assignments[0]||null}
function render(){document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===screen));const el=document.getElementById('screen');el.innerHTML=views[screen]?views[screen]():views.home();wire(el);el.focus({preventScroll:true})}
function assignmentCard(a,expanded=false){const dc=doneCount(a),pct=Math.round(dc/a.steps.length*100);return `<div class="assignment"><div class="assignment-head"><div><span class="eyebrow">${esc(a.unit)}</span><h3>${esc(a.title)}</h3><div class="sub">Due ${fmtDue(a.due)} · ${a.weight}% weighting</div></div><span class="status">${dc===a.steps.length?'Complete':'In progress'}</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="sub">${dc} of ${a.steps.length} steps done · ~${minsRemaining(a)} min left</div>${expanded?`<div class="small-steps">${a.steps.map((s,i)=>`<div class="step ${s[2]?'done':''}"><button class="check ${s[2]?'done':''}" data-step="${a.id}:${i}">${s[2]?'✓':''}</button><div class="row-main"><strong>${s[0]}</strong><small>${s[1]} min</small></div></div>`).join('')}</div><button class="btn btn-primary" style="width:100%;margin-top:14px" data-focus="1">▹ Start a ${state.focusMinutes}-min focus</button>`:`<div class="toolbar" style="margin-top:14px"><button class="btn btn-outline" data-open-assignment="${a.id}">View plan</button></div>`}</div>`}
const views={
home(){const n=nextStep();return `<div class="page-head"><div><div class="eyebrow">${new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Your space to grow.</h1><div class="sub">A little structure. A lot of breathing room.</div></div><button class="btn btn-primary" data-nav="add-assignment">＋ Add assignment</button></div><section class="hero"><div><h2>Good morning, ${state.name}.</h2><div class="sub">You don't have to do it all. Let's start small.</div>${n?`<div class="next-action"><div class="eyebrow">Your next small step · ${n.s[1]} min</div><h3 style="margin:6px 0">${n.s[0]}</h3><small>${n.a.title} · Rough is enough.</small></div><button class="btn btn-primary" style="margin-top:16px;width:100%" data-focus="1">▹ Start a ${state.focusMinutes}-min focus</button>`:''}</div><div class="hero-art"><img src="assets/reach-illustration.svg" alt="REACH growth illustration"></div></section><div class="grid g2" style="margin-top:16px"><div class="card metric"><div class="eyebrow">Weekly study capacity</div><strong>6h 30m</strong><div class="progress-track"><div class="progress-fill" style="width:72%"></div></div><div class="sub">of 9h available · 2h 30m free</div></div><div class="card metric" style="background:linear-gradient(135deg,var(--lav),var(--blue))"><div class="eyebrow">Growth points</div><strong>${state.points}</strong><div class="sub">Small steps, real growth.</div></div></div><div class="card" style="margin-top:16px"><div class="page-head" style="margin-bottom:8px"><h2>Active assignments</h2><button class="btn btn-soft" data-nav="assignments">View all</button></div><div class="list">${state.assignments.slice(0,3).map(a=>`<div class="row"><div class="row-main"><strong>${esc(a.title)}</strong><small>${esc(a.unit)} · ${fmtDue(a.due)}</small></div><button class="btn btn-outline" data-open-assignment="${a.id}">›</button></div>`).join('')}</div></div><h2 style="margin-top:22px">Make it easier</h2><div class="quick-grid"><button class="quick" data-nav="add-assignment">＋<b>Add assignment</b></button><button class="quick" data-nav="planner">▦<b>Find study time</b></button><button class="quick" data-nav="focus">☕<b>Take a break</b></button></div><button class="btn btn-outline setup-link" data-nav="semester-setup">Set up semester & unit outlines</button>`},
today(){const n=nextStep();return `<div class="eyebrow">Today</div><h1>One thing at a time.</h1><div class="sub">Only the next useful actions are shown here.</div><div class="energy" style="margin:18px 0"><span class="sub">How's your energy?</span>${['low','steady','high'].map(x=>`<button class="chip ${state.energy===x?'active':''}" data-energy="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>${n?`<div class="focus-card"><div class="eyebrow">A little headway</div><h2 style="margin-top:8px">${n.s[0]}</h2><div class="sub">${n.a.title}</div><div class="timer-ring" style="--p:25"><span>${String(state.focusMinutes).padStart(2,'0')}:00</span></div><button class="btn btn-primary" style="width:100%" data-focus="1">▹ Start a ${state.focusMinutes}-min focus</button></div>`:''}<h2 style="margin-top:22px">Your gentle agenda</h2><div class="card"><div class="list">${state.commitments.slice(0,5).map(c=>`<div class="row"><span class="status ${c.kind==='break'?'yellow':c.kind==='class'?'blue':''}">${c.time}</span><div class="row-main"><strong>${c.title}</strong><small>${c.day}</small></div></div>`).join('')}</div></div><div class="notice" style="margin-top:16px">16:00–16:30 · Open space. Check your statistics answer, or leave this as breathing room.</div>`},
assignments(){return `<div class="page-head"><div><div class="eyebrow">Assignments</div><h1>Big briefs. Small steps.</h1><div class="sub">Understand it. Break it down. Make it yours.</div></div><button class="btn btn-primary" data-nav="add-assignment">＋ Add assignment</button></div><div class="toolbar" style="margin-bottom:16px"><button class="chip active">Active · ${state.assignments.length}</button><button class="chip">Completed · ${state.assignments.filter(a=>doneCount(a)===a.steps.length).length}</button></div>${state.assignments.map((a,i)=>assignmentCard(a,i===0)).join('')}`},
planner(){const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];return `<div class="page-head"><div><div class="eyebrow">Planner</div><h1>A plan that fits you.</h1><div class="sub">Build around your life, not the other way round.</div></div><button class="btn btn-soft" data-nav="availability">Edit availability</button></div><div class="card" style="background:linear-gradient(135deg,#20552f,#36783f);color:white"><div class="eyebrow" style="color:#c9f5d2">Room for real life</div><strong style="font-size:34px;display:block;margin:6px 0">6h 30m</strong><div>of 9h available · 2h 30m free</div></div><div class="week" style="margin-top:16px">${days.map((d,idx)=>`<div class="day ${idx===2?'today':''}"><strong>${d}</strong>${state.commitments.filter(c=>c.day===d).map(c=>`<div class="event ${c.kind}"><b>${c.time}</b><br>${c.title}</div>`).join('')}${idx===4?`<div class="event study"><b>15:00</b><br>Draft comparison</div>`:''}</div>`).join('')}</div><div class="callout"><h3>Let's spread things out</h3><p>Short blocks, a little buffer, no cramming.</p><button class="btn btn-primary" data-nav="today">▹ Start a ${state.focusMinutes}-min focus</button></div>`},
progress(){return `<div class="eyebrow">Progress</div><h1>Look how far you've grown.</h1><div class="sub">Progress is more than a finished assignment.</div><div class="card" style="margin-top:18px;background:linear-gradient(135deg,#e3f5e8,#eff2fc)"><div class="eyebrow">Your growth points</div><strong style="font-size:54px">${state.points}</strong><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,state.points/3)}%"></div></div><div class="sub">Next bloom at 300 points.</div></div><div class="kpi-grid" style="margin-top:14px"><div class="kpi"><strong>${state.assignments.reduce((n,a)=>n+doneCount(a),0)}</strong><span>Small steps done</span></div><div class="kpi"><strong>3/5</strong><span>Focus sessions</span></div><div class="kpi"><strong>75m</strong><span>Little wins</span></div><div class="kpi"><strong>3</strong><span>Recharge breaks</span></div></div><div class="card" style="margin-top:16px"><h2>A week of little wins</h2><div class="bar-chart">${state.activity.map((x,i)=>`<div class="bar ${x.mins?'active':''}" style="height:${30+x.mins*1.6}px"><span>${x.day}</span></div>`).join('')}</div></div><div class="reward" style="margin-top:16px"><div class="eyebrow">A moment just for you</div><h3>Your favourite café break</h3><p class="sub">200 points · A reward you chose</p><button class="btn btn-primary" data-nav="focus">Start a focus session</button></div>`},
'add-assignment'(){return `<div class="wizard"><div class="eyebrow">Add assignment · 1 / 3</div><h1>Start with the basics.</h1><div class="sub">One assignment. Three small steps.</div><div class="steps"><div class="on"></div><div></div><div></div></div><div class="card"><form id="assignmentDetails"><div class="field"><label>Unit</label><select class="select" name="unit">${state.units.map(u=>`<option value="${u.code}">${u.code} · ${u.name}</option>`).join('')}</select></div><div class="field"><label>Assignment title</label><input class="input" name="title" required placeholder="e.g. Research methods essay"></div><div class="grid g2"><div class="field"><label>Assignment type</label><select class="select" name="type"><option>Essay</option><option>Report</option><option>Presentation</option><option>Problem set</option><option>Project</option></select></div><div class="field"><label>Weighting</label><input class="input" type="number" min="0" max="100" name="weight" value="30"></div></div><div class="grid g2"><div class="field"><label>Due date</label><input class="input" type="date" name="date" required></div><div class="field"><label>Due time</label><input class="input" type="time" name="time" value="17:00"></div></div><button class="btn btn-primary" type="submit">Next →</button></form></div><div class="notice" style="margin-top:16px">This tool helps you understand and plan your assignment. It does not write the assignment for you.</div></div>`},
'add-brief'(){return `<div class="wizard"><div class="eyebrow">Add assignment · 2 / 3</div><h1>Keep the brief close.</h1><div class="steps"><div class="on"></div><div class="on"></div><div></div></div><div class="card"><form id="assignmentBrief"><div class="field"><label>Upload brief (optional)</label><div class="file-box"><input type="file" name="file" accept=".pdf,.doc,.docx,.txt"></div></div><div class="field"><label>Paste assignment brief or key instructions</label><textarea class="textarea" name="brief" required placeholder="Paste the instructions here..."></textarea></div><div class="toolbar"><button class="btn btn-outline" type="button" data-nav="add-assignment">← Back</button><button class="btn btn-primary" type="submit">Next →</button></div></form></div></div>`},
'add-understanding'(){return `<div class="wizard"><div class="eyebrow">Add assignment · 3 / 3</div><h1>What does it mean to you?</h1><div class="steps"><div class="on"></div><div class="on"></div><div class="on"></div></div><div class="card"><form id="assignmentUnderstanding"><div class="field"><label>In your own words, what do you think this assignment is asking you to do?</label><textarea class="textarea" name="understanding" required placeholder="A few rough sentences or bullet points are enough."></textarea></div><div class="callout">If it helps, think about: What do you need to produce? What should you explain or compare? What feels unclear?</div><div class="toolbar" style="margin-top:14px"><button class="btn btn-outline" type="button" data-nav="add-brief">← Back</button><button class="btn btn-primary" type="submit">Check my understanding →</button></div></form></div></div>`},
'understanding-check'(){const d=state.draft||{};return `<div class="wizard"><div class="eyebrow">Understanding check</div><h1>A little more clarity.</h1><div class="card"><div class="notice"><strong>You're on the right track.</strong><br>Your summary identifies the task, expected output and the need to use evidence.</div><h3 style="margin-top:18px">Your understanding</h3><p>${d.understanding||'You need to complete the task in your own words and follow the marking requirements.'}</p><div class="callout"><strong>You may also need to consider</strong><br>Check the marking criteria, word count, referencing expectations and whether any required sources are specified.</div><button class="btn btn-primary" style="margin-top:16px" data-create-plan="1">Create my plan →</button></div></div>`},
'plan-view'(){const a=selectedAssignment();if(!a)return `<div class="empty"><h2>No assignment selected</h2><p>Add an assignment first.</p><button class="btn btn-primary" data-nav="add-assignment">Add assignment</button></div>`;return `<div class="eyebrow">Assignment plan</div><h1>Small steps. Room to breathe.</h1>${assignmentCard(a,true)}<div class="card" style="margin-top:16px"><h2>Suggested study plan</h2><div class="row"><strong>Today</strong><div class="row-main"></div><span>Review the brief · 20 min</span></div><div class="row"><strong>This week</strong><div class="row-main"></div><span>Sources + notes · 1h 15m</span></div><div class="row"><strong>Next week</strong><div class="row-main"></div><span>Structure + draft · 2h 15m</span></div><div class="row"><strong>Final review</strong><div class="row-main"></div><span>Proofread + submit · 40 min</span></div><button class="btn btn-primary" data-nav="planner">Add plan to planner</button></div>`},

'semester-setup'(){return `<div class="wizard"><div class="eyebrow">Semester setup</div><h1>Set up your semester.</h1><div class="sub">A calm starting point. Add your units, then review each outline before the planner uses anything.</div><div class="card" style="margin-top:18px"><h2>Your study period</h2><div class="field"><label>Semester</label><input class="input" id="setupSemester" value="${esc(state.semester)}"></div><h2 style="margin-top:20px">Your current units</h2>${state.units.map((u,i)=>`<div class="row"><div class="row-main"><strong>${esc(u.code)}</strong><small>${esc(u.name)}</small></div><button class="btn btn-outline" data-remove-unit="${i}">Remove</button></div>`).join('')}<form id="setupUnitForm" class="grid g2" style="margin-top:14px"><input class="input" name="code" placeholder="Unit code" required><input class="input" name="name" placeholder="Unit name" required><button class="btn btn-primary" style="grid-column:1/-1">Add unit</button></form></div><button class="btn btn-primary flow-next" data-nav="outline-upload">Upload a unit outline →</button></div>`},
'outline-upload'(){return `<div class="wizard"><div class="eyebrow">Unit outline · 1 / 2</div><h1>Bring your unit into focus.</h1><div class="sub">Upload a unit outline or enter the key details manually. Nothing is accepted without your review.</div><div class="card" style="margin-top:18px"><form id="outlineForm"><div class="field"><label>Unit</label><select class="select" name="unit">${state.units.map(u=>`<option value="${esc(u.code)}">${esc(u.code)} · ${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label>Unit outline</label><div class="file-box"><input type="file" name="file" accept=".pdf,.doc,.docx,.txt"></div></div><div class="notice">This prototype does not upload your document to a server. The file name is stored locally only.</div><button class="btn btn-primary" type="submit">Review extracted details →</button></form></div></div>`},
'outline-review'(){const o=state.outlineDraft||{};return `<div class="wizard"><div class="eyebrow">Unit outline · 2 / 2</div><h1>A quick check, then you decide.</h1><div class="sub">These are suggested details for review. Edit anything before confirming.</div><div class="card" style="margin-top:18px"><div class="notice"><strong>Suggested from your outline</strong><br>Unit: ${esc(o.unit||state.units[0]?.code||'')}<br>File: ${esc(o.fileName||'No file selected')}</div><div class="field" style="margin-top:14px"><label>Teaching period</label><input class="input" id="outlinePeriod" value="${esc(state.semester)}"></div><div class="callout">Academic integrity: this tool helps organise and plan assessment information. It does not write assessment work.</div><div class="toolbar" style="margin-top:14px"><button class="btn btn-outline" data-nav="outline-upload">← Back</button><button class="btn btn-primary" id="confirmOutline">Confirm & continue</button></div></div></div>`},
availability(){return `<div class="eyebrow">Availability & commitments</div><h1>Make room for real life.</h1><div class="sub">Tell the planner when you're busy, so study suggestions fit around your week.</div><div class="grid g2" style="margin-top:18px"><div class="card"><h2>Add commitment</h2><form id="commitmentForm"><div class="field"><label>Day</label><select class="select" name="day">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<option>${d}</option>`).join('')}</select></div><div class="field"><label>Time</label><input class="input" type="time" name="time" required></div><div class="field"><label>Commitment</label><input class="input" name="title" placeholder="Work, class, gym, appointment..." required></div><button class="btn btn-primary">Add commitment</button></form></div><div class="card"><h2>Calendar connection</h2><div class="sub">For this release, you can import an .ics calendar file. No account password is shared with REACH.</div><div class="file-box calendar-import"><input id="icsInput" type="file" accept=".ics,text/calendar"></div><div class="notice" style="margin-top:12px">${state.calendarConnected?'Calendar imported for this device.':'Optional. Your planner works without a calendar connection.'}</div></div></div><div class="card" style="margin-top:16px"><h2>Your recurring commitments</h2>${state.commitments.map((c,i)=>`<div class="row"><span class="status">${c.day} ${c.time}</span><div class="row-main"><strong>${c.title}</strong></div><button class="btn btn-outline" data-remove-commitment="${i}">Remove</button></div>`).join('')}</div>`},
focus(){return `<div class="wizard"><div class="eyebrow">Focus & recharge</div><h1>One small block.</h1><div class="focus-card"><div class="timer-ring" id="timerRing" style="--p:0"><span id="timerText">${formatTimer(remaining)}</span></div><div class="toolbar" style="justify-content:center"><button class="btn btn-primary" id="timerStart">Start</button><button class="btn btn-outline" id="timerPause">Pause</button><button class="btn btn-outline" id="timerReset">Reset</button></div></div><div class="card" style="margin-top:16px"><h2>Recharge your way</h2><div class="field"><label>After a focus block, I like to...</label><select class="select" id="rechargeSelect"><option>Make tea</option><option>Go for a walk</option><option>Stretch</option><option>Read comics</option><option>Listen to music</option><option>Water plants</option><option>Play a short game</option></select></div><div class="grid g2"><div class="field"><label>Focus duration</label><input class="input" id="focusMinutes" type="number" min="5" max="90" value="${state.focusMinutes}"></div><div class="field"><label>Break duration</label><input class="input" id="breakMinutes" type="number" min="5" max="30" value="${state.breakMinutes}"></div></div><button class="btn btn-primary" id="saveRhythm">Save my rhythm</button></div></div>`},
settings(){return `<div class="eyebrow">Profile & settings</div><h1>Make the planner yours.</h1><div class="grid g2"><div class="card"><h2>Profile</h2><div class="field"><label>First name</label><input class="input" id="nameInput" value="${state.name}"></div><div class="field"><label>Semester</label><input class="input" id="semesterInput" value="${state.semester}"></div><button class="btn btn-primary" id="saveProfile">Save profile</button></div><div class="card"><h2>Preferences</h2><div class="settings-list"><div class="setting"><div><strong>Gentle reminders</strong><div class="sub">Supportive, not nagging.</div></div><button class="switch ${state.notifications?'on':''}" id="notifSwitch" aria-label="Toggle reminders"></button></div><div class="setting"><div><strong>Data storage</strong><div class="sub">This release keeps your working data on this device.</div></div><span class="status">Local-first</span></div></div></div></div><div class="card" style="margin-top:16px"><h2>Units</h2>${state.units.map((u,i)=>`<div class="row"><div class="row-main"><strong>${u.code}</strong><small>${u.name}</small></div><button class="btn btn-outline" data-remove-unit="${i}">Remove</button></div>`).join('')}<form id="unitForm" class="grid g3" style="margin-top:14px"><input class="input" name="code" placeholder="Unit code" required><input class="input" name="name" placeholder="Unit name" required><button class="btn btn-primary">Add unit</button></form></div><div class="card" style="margin-top:16px"><h2>Data & handover</h2><div class="sub">Export a backup before changing devices. The file contains planner data only.</div><div class="toolbar" style="margin-top:12px"><button class="btn btn-soft" id="exportData">Export backup</button><label class="btn btn-outline">Import backup<input id="importData" type="file" accept="application/json" hidden></label><button class="btn btn-danger" id="resetData">Reset demo data</button></div></div>`}}
function formatTimer(sec){return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function wire(root){root.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.nav)));root.querySelectorAll('[data-open-assignment]').forEach(b=>b.addEventListener('click',()=>{selectedAssignmentId=Number(b.dataset.openAssignment);nav('plan-view')}));root.querySelectorAll('[data-focus]').forEach(b=>b.addEventListener('click',()=>nav('focus')));root.querySelectorAll('[data-energy]').forEach(b=>b.addEventListener('click',()=>{state.energy=b.dataset.energy;save();render()}));root.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{const[a,i]=b.dataset.step.split(':').map(Number);const as=state.assignments.find(x=>x.id===a);as.steps[i][2]=!as.steps[i][2];if(as.steps[i][2])state.points+=10;save();render()}));
const f1=root.querySelector('#assignmentDetails');if(f1)f1.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(f1);state.draft={unit:fd.get('unit'),title:fd.get('title'),type:fd.get('type'),weight:+fd.get('weight'),date:fd.get('date'),time:fd.get('time')};save();nav('add-brief')});const f2=root.querySelector('#assignmentBrief');if(f2)f2.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(f2);state.draft=Object.assign(state.draft||{},{brief:fd.get('brief'),fileName:fd.get('file')?.name||''});save();nav('add-understanding')});const f3=root.querySelector('#assignmentUnderstanding');if(f3)f3.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(f3);state.draft=Object.assign(state.draft||{},{understanding:fd.get('understanding')});save();nav('understanding-check')});root.querySelectorAll('[data-create-plan]').forEach(b=>b.addEventListener('click',()=>{const d=state.draft;if(d?.title){const newId=Date.now();state.assignments.unshift({id:newId,unit:d.unit,title:d.title,due:`${d.date}T${d.time||'17:00'}`,weight:d.weight,type:d.type,brief:d.brief||'',steps:[['Review brief & marking criteria',20,false],['Find useful sources',45,false],['Organise notes',30,false],['Create structure',45,false],['Draft one section at a time',90,false],['Final review & submit',40,false]]});selectedAssignmentId=newId;state.draft=null;save();toast('Assignment plan created')}nav('assignments')}));const suf=root.querySelector('#setupUnitForm');if(suf)suf.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(suf);const code=String(fd.get('code')||'').trim().toUpperCase();const name=String(fd.get('name')||'').trim();if(code&&name&&!state.units.some(u=>u.code===code)){state.units.push({code,name});state.semester=root.querySelector('#setupSemester')?.value.trim()||state.semester;save();toast('Unit added');render()}});const of=root.querySelector('#outlineForm');if(of)of.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(of);state.outlineDraft={unit:fd.get('unit'),fileName:fd.get('file')?.name||''};save();nav('outline-review')});const co=root.querySelector('#confirmOutline');if(co)co.addEventListener('click',()=>{state.semester=root.querySelector('#outlinePeriod')?.value.trim()||state.semester;state.outlineConfirmed=true;save();toast('Outline confirmed');nav('home')});const cf=root.querySelector('#commitmentForm');if(cf)cf.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(cf);state.commitments.push({day:fd.get('day'),time:fd.get('time'),title:fd.get('title'),kind:'personal'});save();toast('Commitment added');render()});root.querySelectorAll('[data-remove-commitment]').forEach(b=>b.addEventListener('click',()=>{state.commitments.splice(+b.dataset.removeCommitment,1);save();render()}));const ics=root.querySelector('#icsInput');if(ics)ics.addEventListener('change',async()=>{const file=ics.files[0];if(!file)return;const text=await file.text();const lines=text.split(/\r?\n/);let current={};let added=0;for(const line of lines){if(line==='BEGIN:VEVENT')current={};else if(line.startsWith('SUMMARY:'))current.title=line.slice(8);else if(line.startsWith('DTSTART')){const v=line.split(':').pop();if(v&&/^\d{8}T?\d{0,6}/.test(v)){const day=new Date(`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}T${v.includes('T')?`${v.slice(9,11)||'09'}:${v.slice(11,13)||'00'}`:'09:00'}`);current.day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][day.getDay()];current.time=`${String(day.getHours()).padStart(2,'0')}:${String(day.getMinutes()).padStart(2,'0')}`}}else if(line==='END:VEVENT'&&current.title&&current.day){state.commitments.push({day:current.day,time:current.time||'09:00',title:current.title,kind:'calendar'});added++}}state.calendarConnected=true;save();toast(`Imported ${added} calendar item${added===1?'':'s'}`);render()});root.querySelectorAll('[data-remove-unit]').forEach(b=>b.addEventListener('click',()=>{state.units.splice(+b.dataset.removeUnit,1);save();render()}));const uf=root.querySelector('#unitForm');if(uf)uf.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(uf);state.units.push({code:String(fd.get('code')).toUpperCase(),name:fd.get('name')});save();render()});const sp=root.querySelector('#saveProfile');if(sp)sp.addEventListener('click',()=>{state.name=root.querySelector('#nameInput').value.trim()||'Alex';state.semester=root.querySelector('#semesterInput').value.trim();save();toast('Profile saved')});const ns=root.querySelector('#notifSwitch');if(ns)ns.addEventListener('click',()=>{state.notifications=!state.notifications;save();render()});const exp=root.querySelector('#exportData');if(exp)exp.addEventListener('click',()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='REACH-Student-Planner-backup.json';a.click();URL.revokeObjectURL(a.href)});const imp=root.querySelector('#importData');if(imp)imp.addEventListener('change',async()=>{try{state=JSON.parse(await imp.files[0].text());save();toast('Backup imported');render()}catch{toast('That backup file could not be read')}});const reset=root.querySelector('#resetData');if(reset)reset.addEventListener('click',()=>{if(confirm('Reset planner to demo data?')){state=structuredClone(defaults);save();render()}});const ts=root.querySelector('#timerStart'),tp=root.querySelector('#timerPause'),tr=root.querySelector('#timerReset');if(ts)ts.addEventListener('click',()=>{clearInterval(focusTimer);focusTimer=setInterval(()=>{remaining=Math.max(0,remaining-1);const txt=document.getElementById('timerText');if(txt)txt.textContent=formatTimer(remaining);const ring=document.getElementById('timerRing');if(ring)ring.style.setProperty('--p',100-(remaining/(state.focusMinutes*60))*100);if(remaining===0){clearInterval(focusTimer);focusTimer=null;state.points+=30;state.activity[2].mins+=state.focusMinutes;save();toast('Focus complete · +30 growth points')}},1000)});if(tp)tp.addEventListener('click',()=>clearInterval(focusTimer));if(tr)tr.addEventListener('click',()=>{clearInterval(focusTimer);remaining=state.focusMinutes*60;render()});const sr=root.querySelector('#saveRhythm');if(sr)sr.addEventListener('click',()=>{state.focusMinutes=Math.max(5,Math.min(90,+root.querySelector('#focusMinutes').value||15));state.breakMinutes=Math.max(5,Math.min(30,+root.querySelector('#breakMinutes').value||10));state.recharge=root.querySelector('#rechargeSelect').value;remaining=state.focusMinutes*60;save();toast('Focus rhythm saved')})}
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.nav)));render();

</script>
</body>
